spring:
  application:
    name: AirGateway
  config:
    import:
      - nacos:airRocketMQConfigProperties.yaml?refresh=true
      - nacos:airRedissonConfig.yaml?refresh=true
      - nacos:airMongoDbConfig.yaml?refresh=true
      - nacos:airFlowControl.yaml?refresh=true
      - nacos:airKafkaConfigProperties.yaml?refresh=true
      - nacos:airDiscoveryConfig.yaml?refresh=true
  cloud:
    service-registry:
      auto-registration:
        enabled: false #禁用限制多个注册中心配置
    consul:
      enabled: false  #禁用consul注册中心自动配置
    gateway:
      discovery:
        locator:
          enabled: false #禁用gateway的路由定位器自动配置
      routes:
        - id: health-check
          uri:  http://localhost:10101
          predicates:
            - Path=/health
          filters:
            - SetPath=/
      filter:
        json-to-grpc:
          enabled: false  #禁用grpc自动配置导致启动报错
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: 72461fe0-689e-45fe-bacd-aed8948f99da
        group: AIR_GROUP
        username: dev
        password: 123456
        file-extension: yaml
        cluster-name: AirGatewayCluster
        extension-configs:
          - data-id: airRocketMQConfigProperties.yaml  # RocketMQ 专用配置
            group: AIR_GROUP
            refresh: true
          - data-id: airRedissonConfig.yaml  # redisson 专用配置
            group: AIR_GROUP
            refresh: true
          - data-id: airMongoDbConfig.yaml  # mongodb 专用配置
            group: AIR_GROUP
            refresh: true
          - data-id: airFlowControl.yaml  # flow策略 专用配置
            group: AIR_GROUP
            refresh: true
          - data-id: airKafkaConfigProperties.yaml  # kafka 专用配置
            group: AIR_GROUP
            refresh: true
          - data-id: airDiscoveryConfig.yaml  #服务发现兼容 专用配置
            group: AIR_GROUP
            refresh: true

seata:
  application-id: AirGateway
  tx-service-group: AIR_TX_GROUP
  service:
    vgroup-mapping:
      AIR_TX_GROUP: AirSeataCluster #这个地方必须要在nacos的关于seata的配置文件里面找到，它才能映射
  config:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      namespace: 72461fe0-689e-45fe-bacd-aed8948f99da
      group: AIR_GROUP
      username: dev
      password: 123456
      file-extension: properties
      data-id: seataServer.properties #这里是指seata客户端要从nacos里面的哪个配置文件里面读取配置信息
  registry:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      namespace: 72461fe0-689e-45fe-bacd-aed8948f99da
      group: AIR_GROUP
      username: dev
      password: 123456
      application: SeataServer