flow-control:
  pipelines:
    order-process:
      - operator: rateLimit
        algorithm: Resilience4j
        resource: order.create
        config:
          limitForPeriod: 50
          limitRefreshPeriod: 50000
          timeoutDuration: 5
          writableStackTraceEnabled: true
        orderId: 0
      - operator: rateLimit
        algorithm: TokenBucket
        resource: order.create
        config:
          capacity: 200
          refillRate: 200
        orderId: 1
      - operator: rateLimit
        algorithm: SlidingWindow
        resource: order.create
        config:
          windowSize: 60
          maxRequests: 5000
        orderId: 2
      - operator: circuitBreaker
        algorithm: Resilience4j
        resource: order.service
        config:
          failureRateThreshold: 10
          waitDurationInOpenState: 30000
          permittedNumberOfCallsInHalfOpenState: 50
          slidingWindowSize: 60
          minimumNumberOfCalls: 5
        orderId: 3
      - operator: degradeOnCondition
        algorithm: Resilience4j
        resource: order.sla
        config:
          maxResponseTime: 5000
        orderId: 4